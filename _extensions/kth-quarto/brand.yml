meta: 
  name: 
    full: KTH - Kungliga Tekniska Högskolan
    short: KTH
  link: 
    home: https://www.kth.se
    github: https://github.com/KTH-Library
  description: |
    KTH Royal Institute of Technology is located in Stockholm, Sweden.

logo:
  images:
    icon-color:
      path: favicon.png
      alt: Favicon
    svg-color:
      path: img/kth_logo_blue.svg
      alt: KTH logo
    wide-color:
      path: img/kth_logo_blue_spaced.png
      alt: Blue logo
    tall-color:
      path: img/kth_logo_blue_spaced.png
      alt: Blue logo
  small: svg-color
  medium: wide-color
  large: tall-color

color: 
  palette: 
    sand: "#e6e1dd"
    blue: "#004791"
    indigo: "#6298d2"
    darkblue: "#08004f"
    lightblue: "#e0edfc"
    digitalblue: "#221dd9"
    white: "#fcfcfc"
    gray100: "#f2f2f2"
    gray200: "#ededed"
    gray300: "#e6e6e6"
    gray400: "#8D8D8D"
    gray500: "#9C9C9C"
    gray600: "#a5a5a5"
    gray700: "#646464"
    gray800: "#3e3e3e"
    gray900: "#323232"
    black: "#212121"
    bluelink: "#036eb8"
    lightred: "#fad6d6"
    red: "#d8351e"
    darkred: "#bf2c17"
    darkerred: "#962312"
    purple: "#78001A"
    orange: "#A65900"
    yellow: "#FFBE00"
    lightgreen: "#d8ffe7"
    green: "#3f824e"
    darkgreen: "#366f43"
    darkergreen: "#264f30"
    teal: "#339C9C"
    cyan: "#6298D2"
    gray: "#A5A5A5"
    lightyellow: "#FFF080"
    pink: "#FFCCC4"
    lightteal: "#B2E0E0"
  primary: blue
  success: green
  warning: yellow
  secondary: cyan
  info: sand
  danger: red
  light: gray200
  dark: gray700
  foreground: black
  background: sand
  tertiary: green

typography:
  fonts:
    - family: Figtree
      source: google
  base:
    family: Figtree
    line-height: 1.6
  headings:
    family: Figtree
    weight: 700
    line-height: 1.15
    color: blue
#  link:
#    color: bluelink
  monospace:
    family: IBM Plex Mono
    size: 1em

defaults:
  bootstrap:
    defaults:
    # bootstrap variable definitions
      enable-rounded: false
      link-decoration: none
  quarto:
    format:
      revealjs:
  shiny:
    # shiny specific settings
    theme:
      defaults:
        navbar-bg: $brand-blue

